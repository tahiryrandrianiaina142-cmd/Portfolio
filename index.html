<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Amour ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loader">
    <h1 class="romanticText">
        Prépare-toi mon amour… 💖<br>
        Quelque chose d’incroyable arrive…
    </h1>
</div>

<canvas id="stars"></canvas>

<div class="envelope" onclick="startLove()">💌</div>
    <div id="countdown"></div>

<div id="slideshow">
    <img id="slide" src="photo1.jpg">
</div>

<div id="message"></div>

<div id="finalPage">
    <h2>💍 Veux-tu rester avec moi pour toujours ?</h2>
    <button onclick="yesLove()">Oui ❤️</button>
    <button id="noBtn">Non 😏</button>
    <div id="ultimateYes">💖 ELLE A DIT OUI ❤️💍</div>
</div>

<audio id="music" src="music.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
